[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coder-review-benchmark"
version = "0.1.0"
description = "Reproducible agentic coding and code review benchmark for local Qwen services"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
data = [
  "datasets>=3.0",
  "huggingface_hub>=0.25",
  "pyarrow>=15.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
coder-review-benchmark = "coder_review_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "outputs", ".venv"]
