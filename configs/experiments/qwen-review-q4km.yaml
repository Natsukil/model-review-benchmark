experiment_id: qwen-review-q4km-v1
evaluation_version: model-review-v2
context_policy: common-100k-char-v1

models:
  - profile: qwen2.5-coder-7b
    artifact:
      filename: ${QWEN25_CODER_7B_ARTIFACT_FILENAME:-}
      sha256: ${QWEN25_CODER_7B_ARTIFACT_SHA256:-}
      quantization: Q4_K_M
      serving_engine: ${QWEN25_CODER_7B_SERVING_ENGINE:-}
      serving_engine_version: ${QWEN25_CODER_7B_SERVING_ENGINE_VERSION:-}
    lifecycle:
      model: ${QWEN25_CODER_7B_LMSTUDIO_MODEL:-qwen2.5-coder:latest}
  - profile: qwen3-coder-30b
    artifact:
      filename: ${QWEN3_CODER_30B_ARTIFACT_FILENAME:-}
      sha256: ${QWEN3_CODER_30B_ARTIFACT_SHA256:-}
      quantization: Q4_K_M
      serving_engine: ${QWEN3_CODER_30B_SERVING_ENGINE:-}
      serving_engine_version: ${QWEN3_CODER_30B_SERVING_ENGINE_VERSION:-}
    lifecycle:
      model: ${QWEN3_CODER_30B_LMSTUDIO_MODEL:-qwen3-coder-30b-a3b-instruct}
  - profile: qwen3-coder-next-80b
    artifact:
      filename: ${QWEN3_CODER_NEXT_80B_ARTIFACT_FILENAME:-}
      sha256: ${QWEN3_CODER_NEXT_80B_ARTIFACT_SHA256:-}
      quantization: Q4_K_M
      serving_engine: ${QWEN3_CODER_NEXT_80B_SERVING_ENGINE:-}
      serving_engine_version: ${QWEN3_CODER_NEXT_80B_SERVING_ENGINE_VERSION:-}
    lifecycle:
      model: ${QWEN3_CODER_NEXT_80B_LMSTUDIO_MODEL:-Qwen3-Coder-Next}

datasets:
  - suite: swe_review
    profile: swe-review-balanced-500-v1
  - suite: martian
    profile: martian-offline-50-v1

judge:
  profile: judge
  artifact:
    filename: ${JUDGE_ARTIFACT_FILENAME:-}
    sha256: ${JUDGE_ARTIFACT_SHA256:-}
    serving_engine: ${JUDGE_SERVING_ENGINE:-}
    serving_engine_version: ${JUDGE_SERVING_ENGINE_VERSION:-}
  lifecycle:
    model: ${JUDGE_LMSTUDIO_MODEL:-independent-review-judge}

# Disabled by default: preloaded Base URLs from models.yaml/.env are used.
lifecycle:
  enabled: false
  base_url: ${LMSTUDIO_MANAGEMENT_BASE_URL:-http://127.0.0.1:1234}
  api_key: ${LMSTUDIO_API_KEY:-}
  timeout: 600
